[project]
name = "sihijau-be"
version = "0.1.0"
description = "SiHijau Backend API - Smart Waste Scanner & Decision Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.2",
    "alembic>=1.13.3",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "boto3>=1.35.30",
    "aioboto3>=13.2.0",
    "pillow>=10.4.0",
    "redis>=5.0.8",
    "sqladmin>=0.20.1",
    "itsdangerous>=2.2.0",
    "google-genai>=0.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
